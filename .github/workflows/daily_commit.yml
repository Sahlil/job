name: Daily Python Script

on:
  schedule:
    # Berjalan setiap jam 00:00 UTC (Jam 08:00 WITA) setiap hari
    - cron: '0 0 * * *'
  workflow_dispatch: # Mengizinkan kamu menjalankan script secara manual dari tombol di GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Memberikan izin agar bot bisa melakukan commit/push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Sesuaikan dengan versi Python kamu

      - name: Install uv (karena kamu menggunakan uv.lock)
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -r pyproject.toml --system # Atau sesuaikan dengan cara instalasimu

      - name: Run Python script
        run: python update_number.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add number.txt
          git commit -m "Update number via GitHub Actions" || echo "No changes to commit"
          git push